<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp MCP architecture</title>
  <desc id="desc">The MCP client talks over stdio to a local MCP server. The server searches the archive and uses a private Unix socket to request live reads from a single sync process. Sync owns the WhatsApp connection and auth database, writes the archive, and uses a bounded attachment parser. Credentials stay with sync.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#496478"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b4d; }
      .title { font-size: 21px; font-weight: 650; }
      .body { font-size: 16px; }
      .label { font-size: 15px; fill: #42566a; }
      .edge { fill: none; stroke: #496478; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .box { fill: #fff; stroke: #a9bdcb; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#fff"/>
  <rect x="260" y="18" width="662" height="518" rx="16" fill="#f3f7fa" stroke="#d4e0e8"/>
  <text x="282" y="48" class="label">ON YOUR MAC</text>
  <rect x="650" y="73" width="236" height="82" rx="10" class="box"/>
  <text x="768" y="106" text-anchor="middle" class="title">Attachment parser</text>
  <text x="768" y="132" text-anchor="middle" class="body">Bounded worker</text>
  <path d="M 768 218 L 768 156" class="edge"/>
  <text x="782" y="187" class="label">Parse files</text>
  <rect x="24" y="218" width="190" height="112" rx="12" class="box"/>
  <text x="119" y="261" text-anchor="middle" class="title">MCP client</text>
  <text x="119" y="290" text-anchor="middle" class="body">User-directed requests</text>
  <rect x="290" y="218" width="236" height="112" rx="12" class="box"/>
  <text x="408" y="259" text-anchor="middle" class="title">MCP server · serve</text>
  <text x="408" y="289" text-anchor="middle" class="body">Tools and cached queries</text>
  <rect x="650" y="218" width="236" height="112" rx="12" fill="#0f766e"/>
  <text x="768" y="259" text-anchor="middle" class="title" style="fill:#fff">Single writer · sync</text>
  <text x="768" y="289" text-anchor="middle" class="body" style="fill:#fff">Live reads and recovery</text>
  <rect x="1000" y="218" width="176" height="112" rx="12" class="box"/>
  <text x="1088" y="262" text-anchor="middle" class="title">WhatsApp</text>
  <text x="1088" y="290" text-anchor="middle" class="body">Linked device</text>
  <path d="M 216 274 L 287 274" class="edge both"/>
  <text x="251" y="204" text-anchor="middle" class="label">stdio</text>
  <path d="M 529 274 L 647 274" class="edge both"/>
  <text x="588" y="188" text-anchor="middle" class="label"><tspan x="588">Private</tspan><tspan x="588" dy="20">Unix socket</tspan></text>
  <path d="M 889 274 L 997 274" class="edge both"/>
  <text x="944" y="188" text-anchor="middle" class="label"><tspan x="944">Baileys</tspan><tspan x="944" dy="20">connection</tspan></text>
  <rect x="290" y="431" width="236" height="82" rx="10" class="box"/>
  <text x="408" y="465" text-anchor="middle" class="title">archive.sqlite</text>
  <text x="408" y="491" text-anchor="middle" class="body">Messages and contacts</text>
  <rect x="650" y="431" width="236" height="82" rx="10" class="box"/>
  <text x="768" y="465" text-anchor="middle" class="title">auth.sqlite</text>
  <text x="768" y="491" text-anchor="middle" class="body">Credentials and session keys</text>
  <path d="M 365 431 L 365 333" class="edge"/>
  <text x="322" y="390" class="label">Read</text>
  <path d="M 690 333 L 690 368 L 468 368 L 468 428" class="edge"/>
  <text x="535" y="357" class="label">Persist updates</text>
  <path d="M 813 333 L 813 428" class="edge both"/>
  <text x="827" y="390" class="label">Session</text>
</svg>
